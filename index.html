<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#000000" />
    <title>Exemple de story · Arthur Benattou</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        font-family: -apple-system, system-ui, "Helvetica Neue", Arial, sans-serif;
        color: #fff;
      }
      .cadre {
        position: relative;
        height: 100vh;
        height: 100dvh;
        max-width: 100vw;
        aspect-ratio: 738 / 1600;
      }
      video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
      }
      .lancer {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        width: 100%;
        border: 0;
        background: rgba(0, 0, 0, 0.5);
        color: #fff;
        font: inherit;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .lancer.cache {
        display: none;
      }
      .rond {
        width: 84px;
        height: 84px;
        border-radius: 50%;
        background: #ffd600;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .rond svg {
        width: 34px;
        height: 34px;
        margin-left: 5px;
      }
      .lancer span {
        font-size: 17px;
        font-weight: 600;
      }
      .lancer small {
        font-size: 13px;
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <div class="cadre">
      <video id="video" src="story.mp4" poster="apercu.jpg" playsinline preload="auto"></video>
      <button class="lancer" id="lancer">
        <div class="rond">
          <svg viewBox="0 0 24 24" fill="#0d0d0b"><path d="M6 3.5l14 8.5-14 8.5z" /></svg>
        </div>
        <span>Lancer la vidéo avec le son</span>
        <small>Exemple de story réalisé par Arthur Benattou</small>
      </button>
    </div>
    <script>
      const video = document.getElementById("video");
      const lancer = document.getElementById("lancer");
      lancer.addEventListener("click", () => {
        lancer.classList.add("cache");
        video.muted = false;
        video.currentTime = 0;
        video.play();
      });
      video.addEventListener("click", () => (video.paused ? video.play() : video.pause()));
      video.addEventListener("ended", () => {
        lancer.querySelector("span").textContent = "Revoir la vidéo";
        lancer.classList.remove("cache");
      });
    </script>
  </body>
</html>
